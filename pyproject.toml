[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "likenessforge"
version = "0.4.5"
description = "Local facial-likeness repair and identity LoRA training. https://kieransimkin.co.uk/danceflow/"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kieran Simkin"}]
keywords = ["DanceFlow", "facial-likeness", "image-repair", "inpainting", "LoRA", "desktop-gui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10.4",
  "huggingface-hub>=0.30",
  "PyYAML>=6.0",
  "requests>=2.32",
  "tqdm>=4.66",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
faces = [
  "opencv-python-headless>=4.10",
  "torch>=2.5",
  "torchvision>=0.20",
]
sam = [
  "torch>=2.5",
  "transformers>=5.0",
  "accelerate>=1.6",
]
diffusion = [
  "torch>=2.5",
  "torchvision>=0.20",
  "diffusers>=0.41.0",
  "transformers>=5.0",
  "accelerate>=1.6",
  "peft>=0.14",
  "safetensors>=0.5",
]
lowvram = [
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
  "torchao>=0.10; platform_system != 'Darwin'",
]
training = [
  "torch>=2.5",
  "torchvision>=0.20",
  "diffusers>=0.41.0",
  "transformers>=5.0",
  "accelerate>=1.6",
  "peft>=0.14",
  "datasets>=3.0",
  "safetensors>=0.5",
  "ftfy>=6.2",
  "tensorboard>=2.18",
]
all = [
  "PySide6>=6.8,<7",
  "opencv-python-headless>=4.10",
  "torch>=2.5",
  "torchvision>=0.20",
  "diffusers>=0.41.0",
  "transformers>=5.0",
  "accelerate>=1.6",
  "peft>=0.14",
  "datasets>=3.0",
  "safetensors>=0.5",
  "ftfy>=6.2",
  "tensorboard>=2.18",
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
dev = ["pytest>=8", "ruff>=0.17,<0.18", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/"
"DanceFlow ecosystem" = "https://kieransimkin.co.uk/danceflow/"
Repository = "https://github.com/kieransimkin/LikenessForge"
Issues = "https://github.com/kieransimkin/LikenessForge/issues"
Documentation = "https://github.com/kieransimkin/LikenessForge#readme"
Changelog = "https://github.com/kieransimkin/LikenessForge/releases"
"Kieran Simkin music" = "https://kieransimkin.co.uk/my-songs/"

[project.scripts]
likenessforge = "likenessforge.cli:main"
likenessforge-gui = "likenessforge.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
likenessforge = ["py.typed", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
